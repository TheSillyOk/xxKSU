name: Sync

permissions:
  contents: write

on:
  push:
  workflow_dispatch:
  schedule:
   - cron: "0 12 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'backslashxx/KernelSU'
          ref: 'master'
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Apply changes
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
          curl -LSs https://gist.github.com/TheSillyOk/8b74b5f2c6b1da211ef93c3176d0e235/raw/08635149ac2badeb1c64f797411613cf3529bd10/xxksu > xxksu.patch
          patch -p1 < xxksu.patch

          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply changes"

      - name: Push
        run: |
          git remote add my https://github.com/${{ github.repository }}
          git push my master -f
