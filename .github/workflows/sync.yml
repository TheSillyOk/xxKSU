name: Sync

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
   - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'TheSillyOk/xxKSU'
          ref: "xx"
          submodules: 'recursive'
          fetch-depth: '0'
          token: "${{ secrets.WORKFLOW_TOKEN }}"

      - name: Apply changes and push
        env:
          GH_TOKEN: "${{ secrets.WORKFLOW_TOKEN }}"
        run: |
          curl -LSs https://gist.github.com/TheSillyOk/8b74b5f2c6b1da211ef93c3176d0e235/raw/xxksu.patch > xxksu.patch
          patch -p1 < xxksu.patch

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          find . -name "*.orig" -delete
          GIST_SHA=$(sha512sum xxksu.patch | grep -oE "^[^ ]{8}")
          rm xxksu.patch

          NEW_WORKFLOW_SHA=$(sha512sum .github/workflows/sync.yml | grep -oE "^[^ ]{8}")

          curl -LSs https://github.com/TheSillyOk/xxKSU/raw/refs/heads/${{ github.ref_name }}/.github/workflows/sync.yml > sync.yml
          WORKFLOW_SHA=$(sha512sum sync.yml | grep -oE "^[^ ]{8}")
          rm sync.yml

          git remote add ksu "https://github.com/tiann/KernelSU"
          git fetch ksu

          SHORT_SHA=$(git rev-parse --short HEAD)
          LATEST_TAG=$(git tag -l | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)

          git fetch ksu refs/tags/${LATEST_TAG}:refs/tags/ksu_latest_tag

          COMMIT_COUNT=$(git rev-list --count ksu_latest_tag..HEAD)
          xx=$(cat manager/build.gradle.kts | grep -oE "commitCount - [0-9]+" | grep -oE "[0-9]+")
          COUNT=$((COMMIT_COUNT - xx))

          sed -i "s/commitCount - ${xx}/commitCount - ${xx} - 1/" manager/build.gradle.kts
          sed -i "s/version_code - ${xx}/version_code - ${xx} - 1/" userspace/ksud/build.rs

          git add .
          git commit -m "Apply changes - $SHORT_SHA"

          TAG="${LATEST_TAG}-${COUNT}-${SHORT_SHA}-${GIST_SHA}"
          if [[ "${{ github.ref_name }}" != "master" ]]; then
            TAG="${LATEST_TAG}-${COUNT}-${{ github.ref_name }}-${SHORT_SHA}-${GIST_SHA}"
          fi

          git remote add my https://github.com/${{ github.repository }}
          git fetch my

          if [[ "${NEW_WORKFLOW_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Workflow changed, syncing again..."
            git push my "xx:${{ github.ref_name }}" -f
            gh workflow run "sync.yml" -R "${{ github.repository }}" -r "${{ github.ref_name }}"
            exit 0
          fi

          if [[ -n "$(git tag -l "${TAG}")" ]]; then
            echo "Skipping sync, commits are already the latest"
          else
            git push my "xx:${{ github.ref_name }}" -f
            git tag "${TAG}"
            git push my "${TAG}"
          fi
